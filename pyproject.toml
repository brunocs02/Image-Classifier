[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "image_classifier"
version = "0.0.1"
description = "Image Classification project using tensorflow"
authors = [
  { name = "Bruno" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "mkdocs",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "==3.14.6"


[tool.ruff]
line-length = 99
src = ["image_classifier"]
include = ["pyproject.toml", "image_classifier/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["image_classifier"]
force-sort-within-sections = true

